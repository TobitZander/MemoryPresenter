<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wedding Memory</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <script src="/static/js/socket.io.min.js"></script>
</head>
<body class="display light-mode">
    <header class="display-header"><span id="matchStatus" class="match-status" aria-live="polite"></span><span id="memoryName"></span><strong id="activeTeam">-</strong><span id="time">00:00</span><span id="mismatchTime" hidden></span></header>
    <div class="board-wrap">
        <div class="letters"></div>
        <div class="row-numbers"></div>
        <div class="board"></div>
    </div>
    <section id="titlePage" class="title-page" hidden>
        <img class="title-page-backdrop" src="/card-back" alt="">
        <p id="titlePageText"></p>
    </section>
    <p id="winner" class="display-winner" hidden></p>
    <div id="matchCelebration" class="match-celebration" aria-hidden="true">🎉</div>
    <aside id="rules" class="rules display-rules" hidden>
        <h2>Spielregeln</h2>
        <ol id="rulesList"></ol>
    </aside>
    <div id="lightbox" class="lightbox" hidden></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
