name: Build and Release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            executable: MemoryPresenter

          - os: windows-latest
            platform: windows
            executable: MemoryPresenter.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: python build.py

      - name: Create release ZIP
        env:
          EXECUTABLE: ${{ matrix.executable }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python -c "import os, shutil; from pathlib import Path; from zipfile import ZIP_DEFLATED, ZipFile; dist=Path('dist'); release=Path('release'); release.mkdir(); shutil.copy2(dist / os.environ['EXECUTABLE'], release / os.environ['EXECUTABLE']); shutil.copytree(dist / 'images', release / 'images'); archive=dist / ('MemoryPresenter-' + os.environ['PLATFORM'] + '.zip'); zip_file=ZipFile(archive, 'w', ZIP_DEFLATED); [zip_file.write(path, path.relative_to(release)) for path in release.rglob('*') if path.is_file()]; zip_file.close()"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryPresenter-${{ matrix.platform }}
          path: MemoryPresenter-${{ matrix.platform }}.zip

  release:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: find artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/MemoryPresenter-linux.zip
            artifacts/**/MemoryPresenter-windows.zip