name: Build and Release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-debian
            executable: MemoryPresenter

          - os: windows-latest
            platform: windows
            executable: MemoryPresenter.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python build.py

      - name: Create release ZIP
        env:
          EXECUTABLE: ${{ matrix.executable }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python -c "import os, shutil; from pathlib import Path; source=Path('dist'); release=Path('release'); release.mkdir(); shutil.copy2(source / os.environ['EXECUTABLE'], release / os.environ['EXECUTABLE']); shutil.copytree(source / 'images', release / 'images'); shutil.make_archive(str(source / ('MemoryPresenter-' + os.environ['PLATFORM'])), 'zip', root_dir=release)"

      - name: Upload executable and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MemoryPresenter-${{ matrix.platform }}
          path: |
            dist/${{ matrix.executable }}
            dist/images/
            dist/MemoryPresenter-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: find artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/MemoryPresenter-linux.zip
            artifacts/**/MemoryPresenter-windows.zip