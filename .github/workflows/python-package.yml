name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            executable: MemoryPresenter

          - os: windows-latest
            platform: windows
            executable: MemoryPresenter.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: python build.py

      - name: Create release ZIP
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir release

          cp "dist/${EXECUTABLE}" release/

          if [ -d "dist/images" ]; then
            cp -r dist/images release/images
          fi

          cd release
          zip -r "../MemoryPresenter-${PLATFORM}.zip" .
          cd ..

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryPresenter-${{ matrix.platform }}
          path: MemoryPresenter-${{ matrix.platform }}.zip

  release:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: find artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/MemoryPresenter-linux.zip
            artifacts/**/MemoryPresenter-windows.zip